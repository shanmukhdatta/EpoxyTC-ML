name: Lightweight scientific code tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate Python syntax
        run: python -m compileall -q src scripts tests
      - name: Execute lightweight tests (no checkpoints/datasets)
        run: python -m pytest -q
      - name: Verify pinned six-column datasets
        run: python scripts/verify_public_datasets.py
      - name: Replay conditional physics
        run: python scripts/verify_physics_results.py
