# Nominal core-search space taken from original Phase 4.1 module.
seed: 42
search_iterations: 8
search_metric: neg_mean_absolute_error
models:
  ExtraTrees:
    model__n_estimators: [80, 140, 220]
    model__max_depth: [null, 6, 12]
    model__min_samples_leaf: [1, 2, 3]
  GradientBoosting:
    model__n_estimators: [70, 130, 210]
    model__learning_rate: [0.03, 0.07, 0.12]
    model__max_depth: [2, 3]
  XGBoost:
    model__n_estimators: [70, 130, 210]
    model__max_depth: [2, 3, 4]
    model__learning_rate: [0.03, 0.07, 0.12]
    model__min_child_weight: [1, 3]
  RandomForest:
    model__n_estimators: [80, 140, 220]
    model__max_depth: [null, 6, 12]
    model__min_samples_leaf: [1, 2, 3]
  SVR:
    model__C: [0.5, 2.0, 10.0, 40.0]
    model__epsilon: [0.02, 0.07, 0.15]
    model__gamma: [scale, 0.01, 0.1]
pretrained:
  TabFM:
    download_only_on_explicit_request: true
    max_num_rows: 200
    n_estimators: 1
  TabICLv2:
    package_reference: tabicl==2.2.0
    n_estimators: 8
    checkpoint_version: tabicl-regressor-v2-20260212.ckpt
    allow_auto_download: false
