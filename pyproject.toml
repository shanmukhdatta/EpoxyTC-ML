[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epoxy-thermal-conductivity-ml"
version = "0.1.0"
description = "Research tools accompanying the epoxy-composite thermal-conductivity manuscript"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<1.9",
  "matplotlib>=3.7,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
optional-models = ["xgboost>=2,<4", "optuna>=3,<5"]

[tool.setuptools]
# The scientific modules intentionally live directly under src/.
# Package distribution title follows the paper; the historical import package "src" is preserved.
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
